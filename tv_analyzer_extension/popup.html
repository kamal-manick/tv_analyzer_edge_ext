<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradingView Analyzer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>TradingView Analyzer</h1>
      <div id="status">Connecting…</div>
    </div>
    <button id="clear" title="Clear captured symbols">Clear</button>
  </header>

  <div class="summary">
    <span id="count">0 symbols</span>
    <span id="updated">—</span>
  </div>
  <div id="stream" class="stream-status">Local stream: connecting…</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Symbol</th>
          <th>LTP</th>
          <th>Chg</th>
          <th>Chg %</th>
          <th>Volume</th>
          <th>Session</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script src="popup.js"></script>
</body>
</html>
